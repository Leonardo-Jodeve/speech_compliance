# 营销通话话术合规质检系统 - 示例配置
# 使用方法：
#   1. 复制本文件为 config.yaml
#   2. 把 ${ENV_NAME} 替换为真实值，或设置同名环境变量
#   3. 敏感信息（数据库密码、ASR Token、TokenHub Key）严禁提交到代码库（手册 #47）

database:
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  schema: public
  echo: false

quality_gate:
  # 通话进入质检的最短时长（秒），必须配置化（手册 #10）
  min_talk_seconds: 15

tokenhub:
  base_url: ${TOKENHUB_BASE_URL}
  api_key: ${TOKENHUB_API_KEY}
  model: deepseek-v4-flash-0731
  temperature: 0.1
  timeout_seconds: 120
  max_retries: 2

asr:
  upload_url: ${ASR_UPLOAD_URL}
  recognize_url: ${ASR_RECOGNIZE_URL}
  authorization: ${ASR_AUTHORIZATION}
  staff_token: ${ASR_STAFF_TOKEN}
  user: admin
  upload_timeout_seconds: 60
  recognition_timeout_seconds: 180
  max_retries: 2

recording:
  # 相对路径在项目根目录启动时生效，兼容 Windows / Linux
  tmp_root: temp/recordings
  download_timeout_seconds: 60
  max_retries: 2

concurrency:
  task_workers: 10
  asr_max_concurrency: 5
  llm_max_concurrency: 10

scoring:
  pass_score: 80.0
  # 场景未配置规则时的行为：SKIPPED 或 REVIEW_REQUIRED（手册 #42）
  no_rule_behavior: SKIPPED

model:
  # 模型缺失规则结果时的兜底状态
  missing_rule_status: REVIEW

logging:
  level: INFO
  format: ""
